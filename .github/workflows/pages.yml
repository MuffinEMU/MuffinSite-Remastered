# Builds site/ as a preview and publishes it to this repo's GitHub Pages
# (kiddreads.github.io/MuffinSite-Remastered). Preview builds are noindex,
# skip GoatCounter, and keep canonical URLs on the official site.
name: Publish preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          PREVIEW: "1"
          SITE_BASE: /MuffinSite-Remastered/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
