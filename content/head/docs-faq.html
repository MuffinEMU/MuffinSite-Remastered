     "@type": "Question",
     "name": "What is MuffinEMU?",
     "acceptedAnswer": {
      "@type": "Answer",
      "text": "A free, open-source Wii U emulator for iPhone and iPad, based on Cemu. MuffinEMU (also written Muffin EMU or Muffin-EMU) runs on iOS and iPadOS 15 or later. It runs a Cemu-based core with a Metal renderer, an on-screen GamePad measured from the real hardware, and the recompiler wherever iOS allows it. You bring your own games and keys."
     }

      "@type": "Answer",

     }

     "name": "Is MuffinEMU related to Go Go Muffin?",
     "acceptedAnswer": {
      "@type": "Answer",
      "text": "No. MuffinEMU is a Wii U emulator for iPhone and iPad. It isn't related to the mobile game Go Go Muffin or to the MuMu emulator."
     }

     "@type": "Question",
     "name": "Do I need to own a Wii U?",

     "@type": "Question",
     "name": "Does Splatoon work?",
     "acceptedAnswer": {
      "@type": "Answer",
      "text": "It is set up to, but it has not been confirmed on hardware. Splatoon (USA, Europe and Japan) runs on its standard settings, and motion aiming, the GamePad touchscreen and the offline modes are in place. None of it has been played through on a device yet. Aiming. Motion aiming is on by default; tilt and turn the device like the GamePad. Settings > Motion & Aiming has sensitivity and a recentre button. For stick-only aiming, turn it off there and switch off Motion Controls in the game's own options. See Motion aiming. No motion sensors. A device without a gyroscope shows a note in Settings > Motion & Aiming, and the GamePad simply stays still. Switch off Motion Controls in the game's own options and aim with the right stick. Controls. The first time Splatoon starts, MuffinEMU turns on Add analog sticks so you can move and steer. If you have already set that option yourself, it is left as you chose it. Map and super jump. These are on the GamePad screen. The first time Splatoon starts, the screen layout shows both screens: side by side on an iPad, with the GamePad as a small inset on an iPhone. Change it in Settings > Display > Screen Layout. Tap a teammate on the map to super jump; hide the on-screen controls first if they cover it. Offline. Octo Valley, the Battle Dojo and Inkopolis Plaza do not need a network connection. Online battles are not covered. Performance. Splatoon is CPU-heavy. The default resolution is chosen for your device's screen and memory, and a single emulated CPU core is the right starting point on a fanless iPad or an iPhone. Lower Resolution in Settings > Graphics if it struggles."
